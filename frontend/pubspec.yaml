name: frontend
description: "Dự án ClassPal - Trợ lý quản lý lớp học thông minh cho sinh viên Đại Nam"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🎨 Icons & Giao diện
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  # 🔥 Cách đổi font "ngầu" mà không bị lỗi file assets
  google_fonts: ^6.2.1 

  # 🛠️ Tiện ích hệ thống & Điều hướng
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.3.2
  google_sign_in: ^6.1.0
  go_router: ^13.0.0
  
  # 🔥 Xử lý ngày tháng & Ngôn ngữ
  intl: ^0.19.0 

  # 📊 Biểu đồ (Dùng cho báo cáo quỹ lớp Finance Report)
  fl_chart: ^0.70.0

  # 🎉 Hiệu ứng pháo hoa (Cho module Đăng ký sự kiện FR3.2)
  confetti: ^0.7.0
  
  # 🌐 Kết nối API với Backend .NET 9
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 🚀 KHAI BÁO TÀI NGUYÊN
  assets:
    - assets/images/
    # - assets/icons/ 
    # Mẹo: Sếp nhớ tạo folder 'assets/images' ở thư mục gốc project nhé!

  # 🖋️ KHAI BÁO FONTS (ĐÃ KHÓA ĐỂ TRÁNH LỖI BIÊN DỊCH)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700