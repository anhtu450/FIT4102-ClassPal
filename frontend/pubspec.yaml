name: frontend
description: "Dự án ClassPal - Trợ lý quản lý lớp học thông minh cho sinh viên Đại Nam"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Thiết lập dải phiên bản rộng để ổn định hơn

dependencies:
  flutter:
    sdk: flutter

  # 🎨 Icons & Giao diện
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  # 🛠️ Tiện ích hệ thống & Điều hướng
  google_maps_flutter: ^2.5.0 # Cập nhật bản mới hơn để mượt hơn
  url_launcher: ^6.3.2
  google_sign_in: ^6.1.0
  go_router: ^13.0.0 # Cập nhật bản mới để tránh lỗi Navigator cũ
  
  # 🔥 Xử lý ngày tháng & Ngôn ngữ
  intl: ^0.19.0 

  # 📊 Biểu đồ (Dùng cho báo cáo quỹ lớp Finance Report)
  fl_chart: ^0.70.0

  # 🎉 Hiệu ứng pháo hoa (Cho module Đăng ký sự kiện FR3.2)
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 🚀 KHAI BÁO TÀI NGUYÊN (Lưu ý: Thụt lề đúng 2 dấu cách)
  assets:
    - assets/images/
    # - assets/icons/ # Mở thêm nếu sếp có dùng icon riêng

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700